<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="620" viewBox="0 0 1800 620" role="img" aria-labelledby="title desc">
  <title id="title">Upload AI Processing Flow</title>
  <desc id="desc">A diagram showing upload processing from file upload through AI analysis, database persistence, vector storage, review, and final task creation.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <style>
      .bg { fill: #f8fafc; }
      .box { fill: #ffffff; stroke: #94a3b8; stroke-width: 2; rx: 14; }
      .db { fill: #eff6ff; stroke: #2563eb; stroke-width: 2; rx: 14; }
      .vector { fill: #f0fdf4; stroke: #16a34a; stroke-width: 2; rx: 14; }
      .ui { fill: #fff7ed; stroke: #ea580c; stroke-width: 2; rx: 14; }
      .ai { fill: #f5f3ff; stroke: #7c3aed; stroke-width: 2; rx: 14; }
      .line { fill: none; stroke: #334155; stroke-width: 2.5; marker-end: url(#arrow); }
      .label { font-family: Arial, Helvetica, sans-serif; font-size: 22px; font-weight: 700; fill: #0f172a; text-anchor: middle; dominant-baseline: middle; }
      .small { font-family: Arial, Helvetica, sans-serif; font-size: 15px; fill: #475569; text-anchor: middle; dominant-baseline: middle; }
      .heading { font-family: Arial, Helvetica, sans-serif; font-size: 30px; font-weight: 800; fill: #0f172a; }
    </style>
  </defs>

  <rect class="bg" width="1800" height="620"/>
  <text class="heading" x="70" y="58">Upload, AI Analysis, Vector Storage, and Task Creation Flow</text>

  <rect class="ui" x="70" y="120" width="180" height="86"/>
  <text class="label" x="160" y="152">Upload File</text>
  <text class="small" x="160" y="181">PDF / Video / Audio</text>

  <rect class="db" x="310" y="120" width="170" height="86"/>
  <text class="label" x="395" y="152">uploads</text>
  <text class="small" x="395" y="181">queued record</text>

  <rect class="box" x="540" y="120" width="230" height="86"/>
  <text class="label" x="655" y="152">Background</text>
  <text class="small" x="655" y="181">processing thread</text>

  <rect class="box" x="830" y="120" width="240" height="86"/>
  <text class="label" x="950" y="152">Extract / Transcribe</text>
  <text class="small" x="950" y="181">PDF text or Whisper</text>

  <rect class="box" x="1130" y="120" width="250" height="86"/>
  <text class="label" x="1255" y="152">Clean Text</text>
  <text class="small" x="1255" y="181">Arabic + English</text>

  <rect class="ai" x="1440" y="120" width="250" height="86"/>
  <text class="label" x="1565" y="152">Groq AI Analysis</text>
  <text class="small" x="1565" y="181">summary / decisions / tasks</text>

  <path class="line" d="M250 163 H310"/>
  <path class="line" d="M480 163 H540"/>
  <path class="line" d="M770 163 H830"/>
  <path class="line" d="M1070 163 H1130"/>
  <path class="line" d="M1380 163 H1440"/>

  <rect class="db" x="1290" y="300" width="220" height="86"/>
  <text class="label" x="1400" y="332">meeting_summaries</text>
  <text class="small" x="1400" y="361">transcript + summary</text>

  <rect class="db" x="1535" y="300" width="220" height="86"/>
  <text class="label" x="1645" y="332">decisions</text>
  <text class="small" x="1645" y="361">extracted_decisions</text>

  <rect class="db" x="1045" y="300" width="220" height="86"/>
  <text class="label" x="1155" y="332">extracted_tasks</text>
  <text class="small" x="1155" y="361">pending AI tasks</text>

  <path class="line" d="M1565 206 V250 H1400 V300"/>
  <path class="line" d="M1565 206 V250 H1645 V300"/>
  <path class="line" d="M1565 206 V250 H1155 V300"/>

  <rect class="box" x="830" y="300" width="170" height="86"/>
  <text class="label" x="915" y="332">Chunk + Embed</text>
  <text class="small" x="915" y="361">1024-d vectors</text>

  <rect class="db" x="590" y="300" width="200" height="86"/>
  <text class="label" x="690" y="332">knowledge_chunks</text>
  <text class="small" x="690" y="361">chunk records</text>

  <rect class="vector" x="350" y="300" width="200" height="86"/>
  <text class="label" x="450" y="332">Pinecone</text>
  <text class="small" x="450" y="361">Vector DB / RAG</text>

  <path class="line" d="M1255 206 V260 H915 V300"/>
  <path class="line" d="M830 343 H790"/>
  <path class="line" d="M590 343 H550"/>

  <rect class="ui" x="1045" y="470" width="220" height="86"/>
  <text class="label" x="1155" y="502">AI Results Modal</text>
  <text class="small" x="1155" y="531">review extracted tasks</text>

  <rect class="ui" x="1325" y="470" width="210" height="86"/>
  <text class="label" x="1430" y="502">Approve Task</text>
  <text class="small" x="1430" y="531">project / assignee</text>

  <rect class="db" x="1600" y="470" width="150" height="86"/>
  <text class="label" x="1675" y="502">tasks</text>
  <text class="small" x="1675" y="531">final task table</text>

  <path class="line" d="M1155 386 V470"/>
  <path class="line" d="M1265 513 H1325"/>
  <path class="line" d="M1535 513 H1600"/>

  <text class="small" x="250" y="585">Frontend sends file</text>
  <text class="small" x="655" y="585">AI service processes asynchronously</text>
  <text class="small" x="1255" y="585">Results are persisted and shown to the user</text>
</svg>
