<!doctype html>
<html lang="ar" dir="rtl" data-theme="light">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ffffff" />
  <meta name="description" content="Teamoria — مساحة تشغيل ذكية تربط معرفة فريقك بقراراته وعمله." />
  <title>Teamoria — نظام تشغيل الفريق</title>
  <script>
    (() => {
      try {
        const language = localStorage.getItem("teamoria_language") || "ar";
        const preference = localStorage.getItem("teamoria_theme") || "system";
        const dark = preference === "dark" || (preference === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.lang = language;
        document.documentElement.dir = language === "ar" ? "rtl" : "ltr";
        document.documentElement.dataset.theme = dark ? "dark" : "light";
        document.documentElement.dataset.themePreference = preference;
      } catch {
        // The React preferences provider applies the same values after hydration.
      }
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
